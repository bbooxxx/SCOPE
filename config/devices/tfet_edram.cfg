-DesignTarget: cache
-CacheAccessMode: Sequential
-Associativity (for cache only): 8
-ProcessNode: 32
-Capacity (KB): 32
-WordWidth (bit): 512
-DeviceRoadmap: HP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: tfet_edram.cell
-Temperature (K): 350
-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-StackedDieCount: 1
-PrintLevel: 1

-ScopeDevice: TFET-eDRAM
-ScopeReadLatency: Lr_s_Nrow
-ScopeReadEnergy: Er_Nrow
-ScopeWriteLatency: 3_ns
-ScopeWriteEnergy: ~10_fJ_per_bit
-ScopeLeakagePower: equal_to_Pref
-ScopeRefreshPower: ~100_aW_per_bit
-ScopeEndurance: >1e15
-ScopeVariation: low
-ScopeDensity: ~35_F2_layout_XL
-ScopeM3DScalability: N/A
