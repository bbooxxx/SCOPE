-DesignTarget: cache
-CacheAccessMode: Sequential
-Associativity (for cache only): 8
-ProcessNode: 32
-Capacity (KB): 32
-WordWidth (bit): 512
-DeviceRoadmap: HP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: 2d_edram.cell
-Temperature (K): 350
-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-StackedDieCount: 1
-PrintLevel: 1

-ScopeDevice: 2D-eDRAM
-ScopeReadLatencyHybrid: Lr_s_Nrow
-ScopeReadLatencyPure: Lr_d_Nrow
-ScopeSelectedReadPath: pure
-ScopeReadEnergy: Er_Nrow
-ScopeReadIon: 120_uA_per_um
-ScopeReadVdd: 1.2_V
-ScopeReadDeltaV: 0.1_V
-ScopeWriteLatency: 20_ns
-ScopeWriteEnergy: ~10_fJ_per_bit
-ScopeLeakagePower: 0_in_v3_demo
-ScopeRefreshPower: not_applicable_in_v3
-ScopeEndurance: >1e15
-ScopeVariation: low
-ScopeDensity: ~35_F2_planar
-ScopeM3DScalability: 1_tier_2TOC
