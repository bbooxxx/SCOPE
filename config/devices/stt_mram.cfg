-DesignTarget: cache
-CacheAccessMode: Sequential
-Associativity (for cache only): 8
-ProcessNode: 32
-Capacity (KB): 32
-WordWidth (bit): 512
-DeviceRoadmap: HP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: stt_mram.cell
-Temperature (K): 350
-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-StackedDieCount: 1
-PrintLevel: 1

-ScopeDevice: STT-MRAM
-ScopeReadLatency: 10_ns
-ScopeReadEnergy: 41_fJ_per_bit
-ScopeWriteLatency: ~20_ns
-ScopeWriteEnergy: 100_fJ_per_bit
-ScopeLeakagePower: 0
-ScopeRefreshPower: 0_uW
-ScopeEndurance: 1e9
-ScopeVariation: low
-ScopeDensity: 53_F2_consider_high_write_current
-ScopeM3DScalability: unspecified
