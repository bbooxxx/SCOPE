-DesignTarget: cache
-CacheAccessMode: Sequential
-Associativity (for cache only): 8
-ProcessNode: 32
-Capacity (KB): 32
-WordWidth (bit): 512
-DeviceRoadmap: HP
-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No
-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No
-Routing: Non-H-tree
-InternalSensing: true
-MemoryCellInputFile: sram.cell
-Temperature (K): 350
-OptimizationTarget: ReadEDP
-EnablePruning: Yes
-BufferDesignOptimization: latency
-StackedDieCount: 1
-PrintLevel: 1

-ScopeDevice: SRAM
-ScopeReadLatency: ~1_ns
-ScopeReadEnergy: 21.5_fJ_per_bit
-ScopeWriteLatency: ~1_ns
-ScopeWriteEnergy: 16.2_fJ_per_bit
-ScopeLeakagePower: 27.5_pW_per_bit
-ScopeRefreshPower: 0_uW
-ScopeEndurance: >1e15
-ScopeVariation: low
-ScopeDensity: 140_F2
-ScopeM3DScalability: N/A
